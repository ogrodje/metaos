spring.application.name=scrapers
logging.level.root=info
server.port=${PORT:8091}
spring.web.resources.add-mappings=false

# Playwright's browser server (ws://...) to use instead of starting Chromium: in k8s a container of its own beside the
# scrapers, from Microsoft's Playwright image, whose version has to be Playwright's here (build.gradle.kts)
scrapers.browser-url=${SCRAPERS_BROWSER_URL:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# MetaOS's events workflow's scraping, as its activity (Activities.kt), on Temporal's task queue scrapers: off without
# TEMPORAL_ADDRESS, e.g. temporal:7233 in k8s, localhost:7233 with compose's. Six sites at once, as Goo scraped them, so
# one slow site doesn't hold up the rest; the browser's pages one at a time whatever that is (Browser.kt)
spring.temporal.connection.target=${TEMPORAL_ADDRESS:}
spring.temporal.namespace=${TEMPORAL_NAMESPACE:default}
spring.temporal.workers[0].name=scrapers
spring.temporal.workers[0].task-queue=scrapers
spring.temporal.workers[0].activity-beans=scraperActivities
spring.temporal.workers[0].capacity.max-concurrent-activity-executors=${SCRAPERS_AT_ONCE:6}
