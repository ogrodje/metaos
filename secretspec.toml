# MetaOS's secrets: what they are and where they live, but never their values. The values are in 1Password:
#   Ogrodje-Prod  what production (k8s/set_secrets.sh), CI and Terraform need
#   Ogrodje-Dev   what only the local setup needs
# devenv loads them into the shell (devenv.yaml, devenv.nix). Non-secret settings (bucket names, URLs, New Relic's IDs,
# KUBECONFIG's path) stay in .envrc.
#
#   secretspec check                         are they all there?
#   secretspec set NAME                      add or change one (it asks for the value)
#   secretspec run -- k8s/set_secrets.sh     run something with them, without devenv
#
# The names are the ones the scripts, the app and Terraform read, PROD_ included, so nothing else had to change.

[project]
name = "metaos"
revision = "1.0"

[providers]
dev = "onepassword://Ogrodje-Dev"
prod = "onepassword://Ogrodje-Prod"

# One profile, `default`, for every machine: devenv.yaml picks it (and exports SECRETSPEC_PROFILE, so `secretspec` in
# the devenv shell uses it too), and CI asks for it. Outside the shell, pass `-P default`, as a user config may name
# another.
[profiles.default]
# --- Local only (Ogrodje-Dev)
POSTGRES_USER = { description = "Local Postgres user (compose.yml)", providers = ["dev"] }
POSTGRES_PASSWORD = { description = "Local Postgres password (compose.yml)", providers = ["dev"] }
GOOGLE_STORAGE_KEY = { description = "JSON key of metaos-storage-dev@ogrodje-metaos (google/storage.sh key dev)", providers = ["dev"] }
NEW_RELIC_LICENSE_KEY = { description = "New Relic ingest key for the local Java agents", providers = ["dev"] }
OPENROUTER_API_KEY = { description = "OpenRouter API key", providers = ["dev"] }
METAOS_AGENTS_CLIENT_SECRET = { description = "Keycloak client secret of metaos-agents (infra/keycloak/realm)", providers = ["dev"] }
GOOGLE_BOT_PASSWORD = { description = "Google bot account's login (iva.ogrodje@gmail.com); MetaOS never uses it", providers = ["dev"] }
KOOFR_PASSWORD = { description = "Koofr bot account's login; MetaOS uses KOOFR_APP_PASSWORD instead", providers = ["dev"] }
DISCORD_CLIENT_ID = { description = "Discord app \"Ogrodje MetaOS\" (keycloak/discord_idp.sh)", providers = ["dev"] }
DISCORD_CLIENT_SECRET = { description = "Discord app \"Ogrodje MetaOS\" (keycloak/discord_idp.sh)", providers = ["dev"] }
GOOGLE_IDP_CLIENT_ID = { description = "Google OAuth client \"Keycloak\" (keycloak/google_idp.sh)", providers = ["dev"] }
GOOGLE_IDP_CLIENT_SECRET = { description = "Google OAuth client \"Keycloak\" (infra/keycloak/dev)", providers = ["dev"] }

# --- Production: k8s/set_secrets.sh (Ogrodje-Prod)
PROD_METAOS_DB_PASSWORD = { description = "The app's Postgres password", providers = ["prod"] }
PROD_KEYCLOAK_DB_PASSWORD = { description = "Keycloak's Postgres password", providers = ["prod"] }
PROD_KEYCLOAK_ADMIN_PASSWORD = { description = "Keycloak's bootstrap admin (\"admin\")", providers = ["prod"] }
PROD_KEYCLOAK_DEV_PASSWORD = { description = "Keycloak's dev user in production", providers = ["prod"], required = false }
PROD_TEMPORAL_DB_PASSWORD = { description = "Temporal's Postgres password", providers = ["prod"] }
PROD_UNLEASH_DB_PASSWORD = { description = "Unleash's Postgres password", providers = ["prod"] }
PROD_UNLEASH_ADMIN_PASSWORD = { description = "Unleash's admin password", providers = ["prod"] }
PROD_UNLEASH_SESSION_SECRET = { description = "Unleash's session secret", providers = ["prod"] }
PROD_UNLEASH_BACKEND_TOKEN = { description = "Unleash token the app reads flags with", providers = ["prod"] }
PROD_UNLEASH_FRONTEND_TOKEN = { description = "Unleash token the front-end reads flags with", providers = ["prod"] }
PROD_GOOGLE_STORAGE_KEY = { description = "JSON key of metaos-storage-prod@ogrodje-metaos (google/storage.sh key prod)", providers = ["prod"], required = false }
PROD_NEW_RELIC_LICENSE_KEY = { description = "New Relic ingest key (account 8666724, EU) for production", providers = ["prod"], required = false }
PROD_PATREON_GATEWAY_TOKEN = { description = "Token MetaOS calls patreon-gateway with", providers = ["prod"], required = false }
PROD_PATREON_TAILSCALE_AUTHKEY = { description = "Tailscale auth key of patreon-gateway's exit node (tag:patreon-gateway)", providers = ["prod"] }
PROD_SONIOX_API_KEY = { description = "Production's own Soniox key; SONIOX_API_KEY is used without it", providers = ["prod"], required = false }

# --- Shared by local and production (Ogrodje-Prod)
DOCKER_REGISTRY_USERNAME = { description = "registry.folk-decibel.ts.net", providers = ["prod"] }
DOCKER_REGISTRY_PASSWORD = { description = "registry.folk-decibel.ts.net", providers = ["prod"] }
GOOGLE_CLIENT_ID = { description = "Google OAuth client \"MetaOS\" (Desktop app)", providers = ["prod"] }
GOOGLE_CLIENT_SECRET = { description = "Google OAuth client \"MetaOS\" (Desktop app)", providers = ["prod"] }
GOOGLE_DRIVE_REFRESH_TOKEN = { description = "The bot's Drive refresh token (google/refresh_token.sh drive)", providers = ["prod"] }
GOOGLE_GMAIL_REFRESH_TOKEN = { description = "The bot's Gmail refresh token (google/refresh_token.sh gmail)", providers = ["prod"], required = false }
KOOFR_APP_PASSWORD = { description = "The bot's Koofr app password", providers = ["prod"], required = false }
DROPBOX_APP_KEY = { description = "MetaOS's Dropbox app", providers = ["prod"], required = false }
DROPBOX_APP_SECRET = { description = "MetaOS's Dropbox app", providers = ["prod"], required = false }
DROPBOX_REFRESH_TOKEN = { description = "The bot's Dropbox refresh token (dropbox/refresh_token.sh)", providers = ["prod"], required = false }
PATREON_CLIENT_ID = { description = "Patreon app client (patreon-gateway)", providers = ["prod"], required = false }
PATREON_CLIENT_SECRET = { description = "Patreon app client (patreon-gateway)", providers = ["prod"], required = false }
PATREON_ACCESS_TOKEN = { description = "Patreon creator access token; only seeds the gateway", providers = ["prod"], required = false }
PATREON_REFRESH_TOKEN = { description = "Patreon creator refresh token; only seeds the gateway", providers = ["prod"], required = false }
SONIOX_API_KEY = { description = "Soniox (project Ogrodje One, US)", providers = ["prod"], required = false }

# --- CI and Terraform (Ogrodje-Prod)
TS_OAUTH_CLIENT_ID = { description = "Tailscale OAuth client \"MetaOS CI GitHub Actions\" (tag:ci)", providers = ["prod"] }
TS_OAUTH_SECRET = { description = "Tailscale OAuth client \"MetaOS CI GitHub Actions\" (tag:ci)", providers = ["prod"] }
KEYCLOAK_ADMIN_USERNAME = { description = "Keycloak master realm admin (infra/keycloak/prod)", providers = ["prod"] }
KEYCLOAK_ADMIN_PASSWORD = { description = "Keycloak master realm admin (infra/keycloak/prod)", providers = ["prod"] }
CLOUDFLARE_API_TOKEN = { description = "Cloudflare token \"MetaOS Terraform\" (infra/cloudflare)", providers = ["prod"] }
TAILSCALE_OAUTH_CLIENT_ID = { description = "Tailscale OAuth client \"MetaOS Terraform\" (infra/tailscale)", providers = ["prod"] }
TAILSCALE_OAUTH_CLIENT_SECRET = { description = "Tailscale OAuth client \"MetaOS Terraform\" (infra/tailscale)", providers = ["prod"] }
NEW_RELIC_USER_KEY = { description = "New Relic user key (NerdGraph) for infra/newrelic", providers = ["prod"] }

# What CI's jobs load (.github/actions/secrets), with 1Password service account "MetaOS CI" (read-only on Ogrodje-Prod):
# registry for the images and the deploy (the tailnet and the registry), terraform for terraform.yml's stacks. The
# deploy's kubeconfig isn't a secret: the Tailscale operator's has no credential, so deploy.yml writes it.
[scopes.registry]
secrets = ["TS_OAUTH_CLIENT_ID", "TS_OAUTH_SECRET", "DOCKER_REGISTRY_USERNAME", "DOCKER_REGISTRY_PASSWORD"]

[scopes.terraform]
secrets = ["KEYCLOAK_ADMIN_USERNAME", "KEYCLOAK_ADMIN_PASSWORD", "NEW_RELIC_USER_KEY", "CLOUDFLARE_API_TOKEN"]

# What a machine that may only read Ogrodje-Dev loads: the devbox nuc8, where agents run, with 1Password service account
# "nuc8 devbox" (read-only on Ogrodje-Dev), sets METAOS_SECRETS_SCOPE=dev, which devenv.nix's enterShell passes on.
# Without it the shell asks for every secret, and those in Ogrodje-Prod would fail. The bot accounts' own logins
# (GOOGLE_BOT_PASSWORD, KOOFR_PASSWORD) aren't in it: nothing runs with them.
[scopes.dev]
secrets = [
  "POSTGRES_USER", "POSTGRES_PASSWORD", "GOOGLE_STORAGE_KEY", "NEW_RELIC_LICENSE_KEY", "OPENROUTER_API_KEY",
  "METAOS_AGENTS_CLIENT_SECRET", "DISCORD_CLIENT_ID", "DISCORD_CLIENT_SECRET", "GOOGLE_IDP_CLIENT_ID",
  "GOOGLE_IDP_CLIENT_SECRET",
]
