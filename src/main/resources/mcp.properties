# MetaOS's MCP server, at /mcp
spring.ai.mcp.server.name=metaos
# Stateless: no session kept between requests, so any of MetaOS's pods can answer any of them (k8s, replicas: 2). No
# tool needs one; the bearer token on each request says who's calling.
spring.ai.mcp.server.protocol=STATELESS

# The tools' version, from what changed in them, which `just mcp-tools` writes (McpToolsTest, CLAUDE.md). Assistants
# keep the tools they were given whatever it says, until they're refreshed, as the Usage page says (refresh-url)
spring.ai.mcp.server.version=0.1.0
metaos.mcp.refresh-url=${METAOS_UI_URL:http://localhost:5173}/usage#refresh
spring.ai.mcp.server.instructions=These are MetaOS's tools at version ${spring.ai.mcp.server.version}. When a tool \
  that the user expects is missing, or one turns down its arguments, the assistant may have an older copy of them than \
  MetaOS has (whoami says its version): the user refreshes them as ${metaos.mcp.refresh-url} says.
