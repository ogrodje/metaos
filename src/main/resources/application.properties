logging.level.root=info

# PG
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.core=warn

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5437}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Send strings untyped so PG compares citext columns case-insensitively
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# MCP
spring.ai.mcp.server.name=metaos
spring.ai.mcp.server.version=0.0.1
# Stateless: no session kept between requests, so any of MetaOS's pods can answer any of them (k8s, replicas: 2). No
# tool needs one; the bearer token on each request says who's calling.
spring.ai.mcp.server.protocol=STATELESS
# endpoint defaults to /mcp

# Auth - Keycloak realm from compose.yml issues the tokens for /mcp and /graphql
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/metaos}
# Public URLs of /mcp and /graphql; each must equal the audience its Keycloak client scopes add - mcp:tools for /mcp,
# metaos:read and metaos:write for /graphql (METAOS_MCP_URL and METAOS_API_URL in compose.yml)
spring.security.oauth2.resourceserver.jwt.audiences=${METAOS_MCP_URL:http://localhost:8080/mcp},${METAOS_API_URL:http://localhost:8080/graphql}

# No static files: the front-end is a service of its own (fe/), which renders the pages
spring.web.resources.add-mappings=false

# Google - MetaOS uses Drive (the Ogrodje folder) and Gmail as Ogrodje's bot account (Google.kt); each is off without
# its refresh token (google/refresh_token.sh)
metaos.google.client-id=${GOOGLE_CLIENT_ID:}
metaos.google.client-secret=${GOOGLE_CLIENT_SECRET:}
metaos.google.drive-refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
metaos.google.drive-root-folder-id=${METAOS_DRIVE_ROOT_FOLDER_ID:}
metaos.google.gmail-refresh-token=${GOOGLE_GMAIL_REFRESH_TOKEN:}

# Koofr - MetaOS works in the folders shared with Ogrodje's bot account, with its app password (Koofr.kt); off without one
metaos.koofr.email=${KOOFR_EMAIL:}
metaos.koofr.app-password=${KOOFR_APP_PASSWORD:}

# Dropbox - MetaOS works in the folders shared with Ogrodje's bot account, through MetaOS's Dropbox app with the bot's
# refresh token (Dropbox.kt, dropbox/refresh_token.sh); off without one
metaos.dropbox.app-key=${DROPBOX_APP_KEY:}
metaos.dropbox.app-secret=${DROPBOX_APP_SECRET:}
metaos.dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}

# Patreon - Ogrodje's Patreon through patreon-gateway, a service of its own that MetaOS alone may call (Patreon.kt,
# patreon-gateway/README.md); off without its token. In the cluster it's http://patreon-gateway
metaos.patreon.gateway-url=${PATREON_GATEWAY_URL:http://localhost:8090}
metaos.patreon.gateway-token=${PATREON_GATEWAY_TOKEN:}

# Google Cloud Storage - MetaOS's own files in a bucket per environment, as a service account that may use only that
# bucket (Storage.kt, google/storage.sh); off without the account's key
metaos.storage.bucket=${METAOS_STORAGE_BUCKET:}
metaos.storage.key=${GOOGLE_STORAGE_KEY:}
# The environment's public bucket, for files everyone may see, e.g. episodes' thumbnails (Images.kt), as the same service
# account, and where it's served: through Cloudflare in production (https://media.ogrodje.si), else by Google itself
metaos.media.bucket=${METAOS_MEDIA_BUCKET:}
metaos.media.url=${METAOS_MEDIA_URL:}
# ffprobe, which reads what's in an episode's video and audio once they're in the bucket (MediaProbe.kt): in MetaOS's
# image, and from devenv on a development machine; FFPROBE when it's elsewhere, e.g. for an IDE that doesn't run devenv
metaos.media.ffprobe=${FFPROBE:ffprobe}

# Actuator - liveness/readiness groups for k8s probes, metrics for Prometheus (k8s/base/deployment-metaos.yaml)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# The same groups as /livez and /readyz on the server port, so the k8s probes check the port that serves traffic
management.endpoint.health.probes.add-additional-paths=true

# /events (Changes.kt): open to anyone, so at most this many streams a pod, each ending after about this long
metaos.changes.max-streams=1000
metaos.changes.lifetime=30m

# spring.docker.compose.lifecycle-management=start-only
