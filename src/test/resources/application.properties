spring.datasource.url=jdbc:postgresql://invalid-host-use-testcontainers:1/none
# Mirror the main PG settings, since this file shadows src/main/resources/application.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.stringtype=unspecified
# What clients get from MCP, as in production (McpServerTest)
spring.config.import=classpath:mcp.properties
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
spring.web.resources.add-mappings=false
# Never contacted - tests use mocked JWTs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://issuer.invalid/realms/metaos
# Workflows (Workflows.kt): off unless a test starts Temporal in memory (spring.temporal.test-server.enabled)
spring.temporal.workers-auto-discovery.enabled=true
spring.temporal.workers-auto-discovery.workflow-packages=si.ogrodje.metaos
spring.temporal.workers-auto-discovery.register-activity-beans=true
metaos.speech.provider=google
metaos.speech.location=eu
metaos.speech.model=long
metaos.soniox.api-key=
metaos.soniox.url=https://api.soniox.com
metaos.soniox.model=stt-async-v5
metaos.slots.google=5
metaos.slots.soniox=5
metaos.slots.agents=2
metaos.slots.check-every=10m
# Agents: never contacted, as no test has OpenRouter's key
spring.ai.openai.api-key=none
spring.ai.openai.chat.max-retries=0
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.name=metaos-agents
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.streamable-http.connections.metaos.url=http://localhost:8080
spring.security.oauth2.client.registration.metaos-agents.client-id=metaos-agents
spring.security.oauth2.client.registration.metaos-agents.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.metaos-agents.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=http://issuer.invalid/realms/metaos/protocol/openid-connect/token
