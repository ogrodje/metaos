spring.datasource.url=jdbc:postgresql://invalid-host-use-testcontainers:1/none
# Mirror the main PG settings, since this file shadows src/main/resources/application.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.stringtype=unspecified
spring.ai.mcp.server.protocol=STATELESS
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
spring.web.resources.add-mappings=false
# Never contacted - tests use mocked JWTs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://issuer.invalid/realms/metaos
