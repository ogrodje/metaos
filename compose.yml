# One project, whichever checkout it runs from (a worktree's too), so its containers and volumes are the same ones
name: metaos

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5437:5432'
    volumes:
      - pg-data:/var/lib/postgresql
    labels:
      org.springframework.boot.jdbc.parameters: '' # ssl=true&sslmode=require'

  # One-shot: creates the "keycloak" database in the postgres service if missing
  # (initdb scripts would only run on an empty data directory).
  keycloak-db-init:
    image: 'postgres:18-alpine'
    depends_on:
      - postgres
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    entrypoint: ['sh', '-c']
    command:
      - |
        until pg_isready -q; do sleep 1; done
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || createdb keycloak

  # Identity provider / OAuth2 authorization server for the MCP endpoint, persisted in the "keycloak" database.
  # Realm "metaos" is imported from ./keycloak on first start only (existing realms are left untouched).
  # The Keycloak production has, with MetaOS's provider (keycloak/remember-me): docker/keycloak.Dockerfile's dev stage,
  # so `docker compose up -d --build keycloak` after a change to either.
  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak.Dockerfile
      target: dev
    # An empty Keycloak to begin with: `just keycloak adopt dev` makes realm metaos (infra/keycloak)
    command: ['start-dev']
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      # Not .envrc's KEYCLOAK_ADMIN_*, which are production's: infra/keycloak/dev signs in as admin / admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Pin the public URL so the token issuer is stable no matter how Keycloak is reached
      - KC_HOSTNAME=http://localhost:8180
      - KC_HEALTH_ENABLED=true
    ports:
      - '127.0.0.1:8180:8080'
    healthcheck:
      test: ['CMD-SHELL', "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Temporal, which runs MetaOS's workflows (Workflows.kt): its development server, from Temporal's CLI, with its own
  # SQLite in a volume and its web UI, http://localhost:8233. MetaOS connects with TEMPORAL_ADDRESS=localhost:7233.
  temporal:
    image: 'temporalio/temporal:1.9.1'
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/home/temporal/temporal.db']
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    volumes:
      # Its home, which the image has as its user's, so the volume is theirs too
      - temporal-data:/home/temporal

volumes:
  temporal-data:
  pg-data:
    driver: "local"
    driver_opts:
      type: none
      device: "$HOME/docker-volumes/pg-metaos"
      o: bind