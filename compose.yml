services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5437:5432'
    volumes:
      - pg-data:/var/lib/postgresql
    labels:
      org.springframework.boot.jdbc.parameters: '' # ssl=true&sslmode=require'

  # One-shot: creates the "keycloak" database in the postgres service if missing
  # (initdb scripts would only run on an empty data directory).
  keycloak-db-init:
    image: 'postgres:18-alpine'
    depends_on:
      - postgres
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    entrypoint: ['sh', '-c']
    command:
      - |
        until pg_isready -q; do sleep 1; done
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || createdb keycloak

  # Identity provider / OAuth2 authorization server for the MCP endpoint, persisted in the "keycloak" database.
  # Realm "metaos" is imported from ./keycloak on first start only (existing realms are left untouched).
  # The Keycloak production has, with MetaOS's provider (keycloak/remember-me): docker/keycloak.Dockerfile's dev stage,
  # so `docker compose up -d --build keycloak` after a change to either.
  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak.Dockerfile
      target: dev
    command: ['start-dev', '--import-realm']
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Pin the public URL so the token issuer is stable no matter how Keycloak is reached
      - KC_HOSTNAME=http://localhost:8180
      - KC_HEALTH_ENABLED=true
      # Substituted into metaos-realm.json at import time
      - METAOS_MCP_URL=${METAOS_MCP_URL:-http://localhost:8080/mcp}
      - METAOS_API_URL=${METAOS_API_URL:-http://localhost:8080/graphql}
      - METAOS_UI_URL=${METAOS_UI_URL:-http://localhost:5173}
      - KEYCLOAK_DEV_PASSWORD=${KEYCLOAK_DEV_PASSWORD:-dev}
    ports:
      - '127.0.0.1:8180:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ['CMD-SHELL', "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pg-data:
    driver: "local"
    driver_opts:
      type: none
      device: "$HOME/docker-volumes/pg-metaos"
      o: bind