<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1130" viewBox="0 0 1240 1130" role="img" aria-label="MetaOS's architecture: the browser and MCP clients reach MetaOS and Keycloak through Cloudflare and ingress-nginx. The browser gets its pages from the front-end, metaos-web, which renders those anyone may see from MetaOS's GraphQL API, and Cloudflare caches them; then it asks MetaOS itself. MetaOS checks tokens with Keycloak's keys, keeps its data in the shared Postgres, which tells it what changed for the browser's pages to show right away, and calls Cloud Storage, Google Drive, Gmail, Koofr and Dropbox, and fetches pictures from Hygraph. Its workflows run on Temporal, a server of its own in the cluster, whose databases are in the shared Postgres and whose UI is on the tailnet only; MetaOS's pods are its workers, and transcribe episodes with Google's Speech-to-Text or Soniox. It reaches Ogrodje's Patreon through patreon-gateway, a pod of its own in the cluster with three containers: the gateway, which reads the campaign, its tiers, posts and members through Patreon's API with the creator token it keeps and refreshes, and uploads episodes' audio and video, from Dropbox links MetaOS gives it, straight to Patreon; a headless Chromium, in Playwright's own image, in which the gateway makes, changes and publishes posts in Patreon's web app, signed in as the bot, Iva; and Tailscale, through which only the browser goes out, by low, a VM that is the tailnet's exit node, as Patreon's bot check turns away the cluster's address. Prometheus scrapes MetaOS, patreon-gateway, Keycloak and Temporal, and passes a few of their metrics on to New Relic: the outside connections, the sign-ins, the pods' memory and restarts, and the node's memory. New Relic gets their requests, errors and logs from its Java agent in each, the browser's errors and page loads from its agent there, and checks from outside that the pages, MetaOS and Keycloak answer. It copies pictures to its public bucket in Cloud Storage, from which the browser loads them at media.ogrodje.si, cached by Cloudflare. The team's artwork, and an episode's video and audio, go from the browser straight to MetaOS's private bucket, with a URL MetaOS signs, and MetaOS takes them from there.">
  <!--
    MetaOS's architecture, the source of architecture.png (`just architecture` renders it). Keep it in step with the
    system: CLAUDE.md says when.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');

    text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #525252; }
    .t { font-size: 14px; font-weight: 600; fill: #141414; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #141414; }
    .m { font-size: 11px; fill: #6B6B6B; }
    .mono.m { font-size: 11px; fill: #6B6B6B; }
    .col { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #6B6B6B; }
    .zl { font-size: 11px; font-weight: 500; fill: #6B6B6B; }
    .box { fill: #FFFFFF; stroke: #D9D6DA; stroke-width: 1; }
    .box.main { stroke: #EC4870; stroke-width: 1.5; }
    .box.unused { stroke-dasharray: 4 3; }
    .row { fill: #F6F5F6; }
    .zone { fill: none; stroke: #C4C0C6; stroke-dasharray: 5 4; }
    .band { fill: #F6F5F6; stroke: #D9D6DA; }
    .edge { fill: none; stroke: #77727A; stroke-width: 1.25; }
    .head { fill: #77727A; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,1 L9,5 L0,9 z"/>
    </marker>
  </defs>

  <rect width="1240" height="1130" fill="#FFFFFF"/>

  <!-- Room above for the pictures' way from Cloud Storage to the browser -->
  <g transform="translate(0 30)">

  <!-- Column headings -->
  <text class="col" x="20" y="40">CLIENTS</text>
  <text class="col" x="1060" y="40">OUTSIDE SERVICES</text>
  <text class="m" x="1060" y="58">called by MetaOS</text>

  <!-- The edge: TLS at Cloudflare, then the cluster's ingress -->
  <rect class="band" x="232" y="92" width="30" height="608" rx="6"/>
  <text class="m" transform="translate(251 396) rotate(-90)" text-anchor="middle">Cloudflare: TLS, caches public pages → ingress-nginx, by path</text>

  <!-- Cluster and namespace -->
  <rect class="zone" x="276" y="66" width="748" height="1012" rx="12"/>
  <text class="zl" x="292" y="88">ogrodje-one · Kubernetes</text>
  <rect class="zone" x="292" y="100" width="716" height="806" rx="10"/>
  <text class="zl" x="308" y="122">namespace metaos-prod</text>

  <!-- Browser -->
  <rect class="box" x="20" y="140" width="180" height="220" rx="8"/>
  <text class="t" x="36" y="166">Browser</text>
  <text x="36" y="186">Vue 3 front-end</text>
  <text class="m" x="36" y="206">hydrates the server's page</text>
  <text class="m" x="36" y="232">keycloak-js keeps the</text>
  <text class="m" x="36" y="248">token in memory</text>
  <text class="m" x="36" y="274">pages show changes as</text>
  <text class="m" x="36" y="290">they happen, without</text>
  <text class="m" x="36" y="306">reloading</text>
  <text class="m" x="36" y="332">New Relic's agent: errors,</text>
  <text class="m" x="36" y="348">page loads</text>

  <!-- The front-end: renders the pages anyone may see, from MetaOS's API, as someone who isn't signed in -->
  <rect class="box" x="410" y="136" width="180" height="70" rx="8"/>
  <text class="t" x="426" y="158">metaos-web</text>
  <text class="m" x="574" y="158" text-anchor="end">Nuxt</text>
  <text class="m" x="426" y="178">renders the public pages,</text>
  <text class="m" x="426" y="194">as for one not signed in</text>

  <!-- MCP clients -->
  <rect class="box" x="20" y="470" width="180" height="96" rx="8"/>
  <text class="t" x="36" y="496">MCP clients</text>
  <text x="36" y="516">Claude Code, claude.ai,</text>
  <text x="36" y="534">ChatGPT, MCP Inspector</text>

  <!-- Keycloak -->
  <rect class="box" x="410" y="350" width="180" height="140" rx="8"/>
  <text class="t" x="426" y="376">Keycloak</text>
  <text class="mono m" x="426" y="394">metaos-auth.ogrodje.si</text>
  <text x="426" y="416">realm metaos</text>
  <text class="m" x="426" y="436">sign-in: Discord, Google</text>
  <text class="m" x="426" y="454">remembered 30 days idle,</text>
  <text class="m" x="426" y="470">90 days at most</text>

  <!-- MetaOS -->
  <rect class="box main" x="664" y="144" width="324" height="450" rx="10"/>
  <text class="t" x="680" y="170">MetaOS</text>
  <text class="m" x="972" y="170" text-anchor="end">Spring Boot · Kotlin</text>
  <text class="mono m" x="680" y="188">metaos.ogrodje.si</text>

  <rect class="row" x="676" y="196" width="300" height="36" rx="5"/>
  <text class="mono" x="688" y="218">/graphql</text>
  <text x="812" y="218">data, the team's with a token</text>
  <rect class="row" x="676" y="238" width="300" height="36" rx="5"/>
  <text class="mono" x="688" y="260">/koofr, /dropbox</text>
  <text x="812" y="260">picture thumbnails</text>
  <rect class="row" x="676" y="280" width="300" height="36" rx="5"/>
  <text class="mono" x="688" y="302">/events</text>
  <text x="812" y="302">what changed, as it does</text>

  <text class="col" x="680" y="366">INSIDE</text>
  <text x="680" y="388">episodes, people, sessions, shows, comments</text>
  <text x="680" y="408">every change logged: who, with</text>
  <text x="680" y="426">which client and which MCP tool</text>
  <text x="680" y="448">outside connections checked hourly</text>
  <text x="680" y="470">episodes transcribed in workflows</text>

  <rect class="row" x="676" y="500" width="300" height="36" rx="5"/>
  <text class="mono" x="688" y="522">/mcp</text>
  <text x="812" y="522">tools for AI assistants</text>
  <rect class="row" x="676" y="542" width="300" height="36" rx="5"/>
  <text class="mono" x="688" y="564">:9090</text>
  <text x="812" y="564">actuator: health, metrics</text>

  <!-- Postgres, shared with the cluster's other apps -->
  <rect class="box" x="664" y="924" width="324" height="140" rx="8"/>
  <text class="t" x="680" y="948">Postgres</text>
  <text class="m" x="972" y="948" text-anchor="end">CNPG main-cluster, shared</text>
  <rect class="row" x="676" y="960" width="146" height="44" rx="5"/>
  <text class="mono" x="688" y="978">metaos</text>
  <text class="m" x="688" y="995">domain, audit_log</text>
  <rect class="row" x="830" y="960" width="146" height="44" rx="5"/>
  <text class="mono" x="842" y="978">metaos_keycloak</text>
  <text class="m" x="842" y="995">Keycloak's realm</text>
  <rect class="row" x="676" y="1012" width="300" height="44" rx="5"/>
  <text class="mono" x="688" y="1030">metaos_temporal(_visibility)</text>
  <text class="m" x="688" y="1047">Temporal's workflows, and what it lists of them</text>

  <!-- patreon-gateway: Ogrodje's Patreon for MetaOS alone, in the namespace, no Ingress; one pod, three containers -->
  <rect class="box" x="708" y="636" width="280" height="254" rx="8"/>
  <text class="t" x="724" y="660">patreon-gateway</text>
  <text class="m" x="972" y="660" text-anchor="end">one pod</text>
  <text class="m" x="724" y="678">Ogrodje's Patreon, for MetaOS alone</text>
  <rect class="row" x="720" y="690" width="256" height="48" rx="5"/>
  <text class="mono" x="732" y="710">gateway</text>
  <text class="m" x="806" y="710">Spring Boot: API, jobs;</text>
  <text class="m" x="806" y="726">tokens, Iva's session</text>
  <rect class="row" x="720" y="760" width="256" height="48" rx="5"/>
  <text class="mono" x="732" y="780">browser</text>
  <text class="m" x="806" y="780">Chromium, headless,</text>
  <text class="m" x="806" y="796">Playwright's own image</text>
  <rect class="row" x="720" y="830" width="256" height="48" rx="5"/>
  <text class="mono" x="732" y="850">tailscale</text>
  <text class="m" x="806" y="850">ephemeral machine,</text>
  <text class="m" x="806" y="866">the browser's way out</text>
  <path class="edge" d="M744 738 V758" marker-end="url(#arrow)"/>
  <text class="m" x="754" y="753">Playwright, :3000</text>
  <path class="edge" d="M744 808 V828" marker-end="url(#arrow)"/>
  <text class="m" x="754" y="823">SOCKS5, :1055</text>
  <path class="edge" d="M898 594 V634" marker-end="url(#arrow)"/>
  <text class="m" x="890" y="610" text-anchor="end">posts, members, jobs;</text>
  <text class="m" x="890" y="626" text-anchor="end">files as Dropbox links</text>
  <!-- The gateway reads through Patreon's API and uploads files to it straight from the cluster -->
  <path class="edge" d="M976 704 H1058" marker-end="url(#arrow)"/>
  <text class="m" x="1017" y="698" text-anchor="middle">API, uploads</text>
  <!-- The browser's pages go out through low, a VM: Patreon's bot check turns away the cluster's address, not low's -->
  <path class="edge" d="M976 854 H1058" marker-end="url(#arrow)"/>
  <text class="m" x="1017" y="848" text-anchor="middle">tailnet</text>
  <rect class="box" x="1060" y="816" width="160" height="76" rx="8"/>
  <text class="t" x="1076" y="840">low</text>
  <text class="m" x="1076" y="858">oto.srv4all.net, the</text>
  <text class="m" x="1076" y="874">tailnet's exit node</text>
  <path class="edge" d="M1092 816 V738" marker-end="url(#arrow)"/>
  <text class="m" x="1100" y="772">web app, from</text>
  <text class="m" x="1100" y="788">low's address</text>

  <!-- Temporal: one pod, its services all in one; MetaOS's pods are its workers; its UI is on the tailnet only -->
  <rect class="box" x="512" y="640" width="164" height="150" rx="8"/>
  <text class="t" x="528" y="664">Temporal</text>
  <text class="m" x="660" y="664" text-anchor="end">1.32</text>
  <text class="m" x="528" y="682">durable workflows</text>
  <rect class="row" x="524" y="694" width="140" height="34" rx="5"/>
  <text class="mono" x="534" y="716">server</text>
  <text class="m" x="590" y="716">one pod</text>
  <rect class="row" x="524" y="742" width="140" height="34" rx="5"/>
  <text class="mono" x="534" y="763">ui</text>
  <text class="m" x="590" y="763">tailnet only</text>
  <path class="edge" d="M670 594 V638" marker-end="url(#arrow)"/>
  <text class="m" x="662" y="612" text-anchor="end">workflows, as</text>
  <text class="m" x="662" y="627" text-anchor="end">its workers</text>
  <path class="edge" d="M670 790 V922" marker-end="url(#arrow)"/>

  <!-- Prometheus, the cluster's: scrapes MetaOS, patreon-gateway and Keycloak, passes a few metrics on to New Relic -->
  <rect class="box" x="410" y="924" width="180" height="108" rx="8"/>
  <text class="t" x="426" y="948">Prometheus</text>
  <text class="m" x="426" y="968">ServiceMonitors: MetaOS,</text>
  <text class="m" x="426" y="984">patreon-gateway, Keycloak,</text>
  <text class="m" x="426" y="1000">Temporal; some on to</text>
  <text class="m" x="426" y="1016">New Relic</text>

  <!-- Outside services; dashed: connected and checked, but no feature uses it yet -->
  <rect class="box" x="1060" y="132" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="152">Cloud Storage</text>
  <text class="m" x="1076" y="169">pictures, video, audio · key</text>
  <rect class="box" x="1060" y="186" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="206">Google Drive</text>
  <text class="m" x="1076" y="223">docs · refresh token</text>
  <rect class="box unused" x="1060" y="240" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="260">Gmail</text>
  <text class="m" x="1076" y="277">not used yet</text>
  <rect class="box" x="1060" y="294" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="314">Koofr</text>
  <text class="m" x="1076" y="331">recordings, photos</text>
  <rect class="box" x="1060" y="348" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="368">Dropbox</text>
  <text class="m" x="1076" y="385">artwork, episode files</text>
  <rect class="box" x="1060" y="402" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="422">Hygraph</text>
  <text class="m" x="1076" y="439">CMS · pictures by URL</text>
  <rect class="box" x="1060" y="456" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="476">Speech-to-Text</text>
  <text class="m" x="1076" y="493">Google · transcripts · EU</text>
  <rect class="box" x="1060" y="510" width="160" height="46" rx="8"/>
  <text class="t" x="1076" y="530">Soniox</text>
  <text class="m" x="1076" y="547">transcripts, speakers · US</text>
  <rect class="box" x="1060" y="636" width="160" height="100" rx="8"/>
  <text class="t" x="1076" y="660">Patreon</text>
  <text class="m" x="1076" y="680">API: tiers, posts,</text>
  <text class="m" x="1076" y="696">members · creator token</text>
  <text class="m" x="1076" y="714">web app, as Iva: drafts,</text>
  <text class="m" x="1076" y="730">audio, video, publishing</text>
  <!-- New Relic, EU: Java agents in MetaOS and patreon-gateway, the browser's agent, uptime checks from outside -->
  <rect class="box" x="1060" y="564" width="160" height="64" rx="8"/>
  <text class="t" x="1076" y="584">New Relic</text>
  <text class="m" x="1076" y="601">EU · requests, errors, logs;</text>
  <text class="m" x="1076" y="617">browser, uptime, metrics</text>
  <text class="m" x="1060" y="924">all but Hygraph, New Relic</text>
  <text class="m" x="1060" y="940">and the speech-to-text</text>
  <text class="m" x="1060" y="956">providers checked hourly,</text>
  <text class="m" x="1060" y="972">reported as</text>
  <text class="mono m" x="1060" y="990">metaos_*_connected</text>

  <!-- Browser to the front-end for its pages, which asks MetaOS's GraphQL API inside the cluster -->
  <path class="edge" d="M200 166 H408" marker-end="url(#arrow)"/>
  <text class="m" x="350" y="160" text-anchor="middle">pages</text>
  <path class="edge" d="M590 172 H662" marker-end="url(#arrow)"/>
  <text class="m" x="626" y="165" text-anchor="middle">GraphQL</text>

  <!-- Browser to MetaOS and Keycloak -->
  <path class="edge" d="M200 214 H662" marker-end="url(#arrow)"/>
  <path class="edge" d="M200 256 H662" marker-end="url(#arrow)"/>
  <path class="edge" d="M200 298 H662" marker-end="url(#arrow)"/>
  <path class="edge" d="M110 360 V400 H408" marker-end="url(#arrow)"/>
  <text class="m" x="402" y="376" text-anchor="end">signs in, PKCE;</text>
  <text class="m" x="402" y="394" text-anchor="end">links sign-ins</text>

  <!-- MCP clients to Keycloak and MetaOS -->
  <path class="edge" d="M110 470 V440 H408" marker-end="url(#arrow)"/>
  <text class="m" x="402" y="434" text-anchor="end">registers, signs in</text>
  <path class="edge" d="M200 518 H662" marker-end="url(#arrow)"/>
  <text class="m" x="570" y="511" text-anchor="middle">MCP over HTTP, with the token</text>

  <!-- MetaOS checks tokens with Keycloak's keys -->
  <path class="edge" d="M664 420 H592" marker-end="url(#arrow)"/>
  <text class="m" x="627" y="413" text-anchor="middle">token keys</text>

  <!-- MetaOS to Postgres -->
  <path class="edge" d="M684 594 V922" marker-end="url(#arrow)"/>
  <text class="m" x="692" y="919">JPA · Flyway · LISTEN</text>

  <!-- Prometheus scrapes the actuator, which no Ingress routes -->
  <path class="edge" d="M500 924 V560 H662" marker-end="url(#arrow)"/>
  <text class="m" x="508" y="612">scrapes</text>
  <!-- And Keycloak's management port, which no Ingress routes either -->
  <path class="edge" d="M440 924 V492" marker-end="url(#arrow)"/>

  <!-- MetaOS to the outside services -->
  <path class="edge" d="M988 155 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 209 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 263 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 317 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 371 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 425 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 479 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M988 533 H1058" marker-end="url(#arrow)"/>
  <text class="m" x="1023" y="149" text-anchor="middle">copies</text>

  <!-- Their Java agents report to New Relic -->
  <path class="edge" d="M988 588 H1058" marker-end="url(#arrow)"/>
  <path class="edge" d="M968 636 V612 H1058" marker-end="url(#arrow)"/>

  <!-- The browser loads pictures from the public bucket, past MetaOS: at media.ogrodje.si, cached by Cloudflare -->
  <path class="edge" d="M140 140 V-8 H1204 V130" marker-end="url(#arrow)"/>
  <text class="m" x="620" y="-14" text-anchor="middle">pictures for everyone: media.ogrodje.si, cached by Cloudflare</text>

  <!-- The team's artwork, video and audio go from the browser straight to the private bucket, with a URL MetaOS signs -->
  <path class="edge" d="M176 140 V14 H1182 V130" marker-end="url(#arrow)"/>
  <text class="m" x="620" y="8" text-anchor="middle">the team's artwork, video and audio, straight to the private bucket with a signed URL; MetaOS takes it from there</text>
  </g>
</svg>
