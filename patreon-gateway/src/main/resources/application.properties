spring.application.name=patreon-gateway
logging.level.root=info
server.port=${PORT:8090}
spring.web.resources.add-mappings=false

# Patreon's API (v2), as the campaign's creator: the app's client and its creator token, which the gateway refreshes and
# keeps in state/tokens.json from then on (PatreonApi.kt)
patreon.client-id=${PATREON_CLIENT_ID:}
patreon.client-secret=${PATREON_CLIENT_SECRET:}
patreon.access-token=${PATREON_ACCESS_TOKEN:}
patreon.refresh-token=${PATREON_REFRESH_TOKEN:}
# The bot, who the browser is signed in as (Browser.kt)
patreon.account=${PATREON_ACCOUNT:iva.ogrodje@gmail.com}
# Tokens, the browser's session and what failed changes saw; a volume of its own in k8s
patreon.state-dir=${PATREON_STATE_DIR:state}
# Files on their way to Patreon, gigabytes for an episode's video; state/downloads when blank, scratch space in k8s
patreon.downloads-dir=${PATREON_DOWNLOADS_DIR:}
# What failed changes' pages showed (screenshots, HTML) is deleted once it's this old: it may hold who's signed in
patreon.failures-kept=${PATREON_FAILURES_KEPT:14d}
# Run the browser where you can see it, to watch a change (development only)
patreon.headed=${PATREON_HEADED:false}
# Playwright's browser server (ws://...) to use instead of starting Chromium: in k8s a container of its own beside the
# gateway, from Microsoft's Playwright image, whose version has to be Playwright's here (build.gradle.kts)
patreon.browser-url=${PATREON_BROWSER_URL:}
# The proxy the browser goes through: in k8s Tailscale's in the pod, to an exit node at home (nuc8), as Patreon's bot
# check turns away pages asked from the cluster's datacenter address. Only the browser: the API and uploads go direct
patreon.browser-proxy=${PATREON_BROWSER_PROXY:}

# Every call but /health needs "Authorization: Bearer <this>"; without one the gateway answers none (GatewayAuth.kt)
gateway.token=${PATREON_GATEWAY_TOKEN:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# MetaOS's workflows' changes in Patreon, as their activities (Activities.kt), on Temporal's task queue patreon: off
# without TEMPORAL_ADDRESS, e.g. temporal:7233 in k8s, localhost:7233 with compose's. One at a time, as there's one
# browser, and at most PATREON_ACTIVITIES_PER_SECOND (one every 20 s) whoever asks, as Patreon turns the gateway away after
# some 15-20 page loads in a few minutes, and each change loads one or two
spring.temporal.connection.target=${TEMPORAL_ADDRESS:}
spring.temporal.namespace=${TEMPORAL_NAMESPACE:default}
spring.temporal.workers[0].name=patreon
spring.temporal.workers[0].task-queue=patreon
spring.temporal.workers[0].activity-beans=patreonActivities
spring.temporal.workers[0].capacity.max-concurrent-activity-executors=1
spring.temporal.workers[0].rate-limits.max-task-queue-activities-per-second=${PATREON_ACTIVITIES_PER_SECOND:0.05}
