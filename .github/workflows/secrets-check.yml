name: Secrets check (temporary)

# One-off, removed before the branch is merged: checks that the GitHub secrets the workflows used until now hold the
# same values as 1Password, before they're deleted, and that the kubeconfig deploy.yml writes reaches the cluster.
# Prints only match or mismatch per secret, never a value or a hash of one: this repository's logs are public.
on:
  push:
    branches: [ secretspec-1password ]
    paths: [ .github/workflows/secrets-check.yml ]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/secrets
        with:
          scope: registry
          token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - uses: ./.github/actions/secrets
        with:
          scope: terraform
          token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Compare GitHub's secrets with 1Password's
        env:
          GH_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          GH_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          GH_DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          GH_DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          GH_KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          GH_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_NEW_RELIC_USER_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          GH_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          fail=0
          for n in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DOCKER_REGISTRY_USERNAME DOCKER_REGISTRY_PASSWORD \
                   KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD CLOUDFLARE_API_TOKEN NEW_RELIC_USER_KEY; do
            gh="GH_$n"
            if [ -z "${!gh}" ]; then echo "$n: not in GitHub"; fail=1
            elif [ -z "${!n}" ]; then echo "$n: not in 1Password"; fail=1
            elif [ "${!gh}" = "${!n}" ]; then echo "$n: match"
            else echo "$n: MISMATCH"; fail=1; fi
          done
          # GitHub's KUBECONFIG against the one deploy.yml now writes: the same server and the same placeholder token?
          printf %s "$GH_KUBECONFIG" | base64 -d > /tmp/old-kubeconfig 2>/dev/null || true
          old_server=$(KUBECONFIG=/tmp/old-kubeconfig kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)
          old_token=$(KUBECONFIG=/tmp/old-kubeconfig kubectl config view --minify --raw -o jsonpath='{.users[0].user.token}' 2>/dev/null)
          [ "$old_server" = "https://tailscale-operator.folk-decibel.ts.net" ] && echo "KUBECONFIG server: match" || { echo "KUBECONFIG server: MISMATCH"; fail=1; }
          [ "$old_token" = "unused" ] && echo "KUBECONFIG token: placeholder, as expected" || { echo "KUBECONFIG token: NOT the placeholder"; fail=1; }
          rm -f /tmp/old-kubeconfig
          exit $fail

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          ping: tailscale-operator.folk-decibel.ts.net
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: azure/setup-kubectl@v5

      # deploy.yml's Configure kubectl, then something read-only that only the deployer role may do
      - name: Reach the cluster with deploy.yml's kubeconfig
        run: |
          kubectl config set-cluster tailscale-operator.folk-decibel.ts.net \
            --server=https://tailscale-operator.folk-decibel.ts.net
          kubectl config set-credentials tailscale-auth --token=unused
          kubectl config set-context tailscale-operator.folk-decibel.ts.net \
            --cluster=tailscale-operator.folk-decibel.ts.net --user=tailscale-auth
          kubectl config use-context tailscale-operator.folk-decibel.ts.net
          kubectl -n metaos-prod get deployments -o name
