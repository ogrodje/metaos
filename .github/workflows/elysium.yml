name: Elysium's Canvas image

# Elysium's Canvas (elysium/canvas/Dockerfile): OpenHands' Agent Canvas with MetaOS' development tools, for the
# factory's agents (infra/elysium). Built when its Dockerfile changes, on master or an elysium/ branch, or by hand, and
# pushed to Vultr's registry as elysium-canvas:<Canvas' version>-<the Dockerfile's hash>, which `just canvas-image` says
# too, and as latest from master. A Dockerfile whose image is there already isn't built again.
#
# Secrets: as deploy.yml's, the repository's OP_SERVICE_ACCOUNT_TOKEN, with which it loads secretspec.toml's scope
# registry:
#   VULTR_REGISTRY_USERNAME / VULTR_REGISTRY_PASSWORD  Vultr's registry: a push login that doesn't run out

on:
  push:
    branches: [ master, 'elysium/**' ]
    paths: [ elysium/canvas/**, .github/workflows/elysium.yml ]
  workflow_dispatch:

concurrency:
  group: elysium-canvas-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ams.vultrcr.com
  IMAGE: ams.vultrcr.com/ogrodje/elysium-canvas

jobs:
  canvas:
    name: elysium-canvas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/secrets
        with:
          scope: registry
          token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.VULTR_REGISTRY_USERNAME }}
          password: ${{ env.VULTR_REGISTRY_PASSWORD }}

      - name: Its tag
        id: tag
        run: |
          canvas=$(sed -n 's/^ARG CANVAS=.*://p' elysium/canvas/Dockerfile)
          tag="$canvas-$(git hash-object elysium/canvas/Dockerfile | cut -c1-8)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$tag is there: not built again"
          else
            echo "Building $IMAGE:$tag"
          fi

      # Canvas' image is a few GB unpacked: room for it, from what the runner has preinstalled and nothing here uses
      - if: steps.tag.outputs.found != 'true'
        name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - if: steps.tag.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      # No provenance attestation, so the image is a plain manifest rather than an index, as deploy.yml's
      - if: steps.tag.outputs.found != 'true'
        name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: elysium/canvas
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          push: true
          provenance: false

      - if: github.ref == 'refs/heads/master'
        name: Tag it latest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker buildx imagetools create --prefer-index=false -t "$IMAGE:latest" "$IMAGE:$TAG"
