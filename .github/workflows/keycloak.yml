name: Keycloak

# Runs one of the keycloak/ scripts against production's realm, for changes metaos-realm.json can't make there, as
# Keycloak imports it only once. Started by hand: Actions → Keycloak → Run workflow.
#
# Reaches Keycloak through a port-forward over Tailscale, as admin with the password from keycloak-secret, so it needs
# only the deploy's secrets (deploy.yml): TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET and KUBECONFIG.

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run (each is idempotent)
        type: choice
        options:
          - trusted_hosts.sh
          - sessions.sh

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metaos-auth.ogrodje.si
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          ping: tailscale-operator.folk-decibel.ts.net
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: azure/setup-kubectl@v5

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # KC_HOSTNAME pins the public URL, so tokens got through the port-forward are the same as through the ingress
      - name: Run ${{ inputs.script }}
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          password=$(kubectl -n metaos-prod get secret keycloak-secret -o jsonpath='{.data.keycloak_admin_password}' | base64 -d)
          echo "::add-mask::$password"

          kubectl -n metaos-prod port-forward svc/keycloak 8180:80 &
          forward=$!
          trap 'kill $forward' EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://localhost:8180/realms/master && break
            sleep 1
          done

          KEYCLOAK_URL=http://localhost:8180 KEYCLOAK_ADMIN_USERNAME=admin KEYCLOAK_ADMIN_PASSWORD="$password" \
            "keycloak/$SCRIPT"
