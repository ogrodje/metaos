name: Keycloak

# Runs one of the keycloak/ scripts against production's realm, for changes metaos-realm.json can't make there, as
# Keycloak imports it only once. Started by hand: Actions → Keycloak → Run workflow.
#
# Reaches Keycloak through a port-forward over Tailscale, with the deploy's secrets (deploy.yml): TS_OAUTH_CLIENT_ID,
# TS_OAUTH_SECRET and KUBECONFIG. It signs in to realm master as KEYCLOAK_ADMIN_USERNAME with KEYCLOAK_ADMIN_PASSWORD,
# repo or environment secrets; without them as admin with keycloak-secret's password, which only creates the first
# admin, so it's wrong once that admin's password has been changed.

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run (each is idempotent)
        type: choice
        # Runs started without inputs (the GitHub app, the API) get this rather than nothing
        default: trusted_hosts.sh
        options:
          - trusted_hosts.sh
          - sessions.sh

# Only reads the repo. Actions are pinned to commits and secrets come in through env, as in deploy.yml
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metaos-auth.ogrodje.si
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          ping: tailscale-operator.folk-decibel.ts.net
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Configure kubectl
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # KC_HOSTNAME pins the public URL, so tokens got through the port-forward are the same as through the ingress
      - name: Run ${{ inputs.script || 'trusted_hosts.sh' }}
        env:
          SCRIPT: ${{ inputs.script || 'trusted_hosts.sh' }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME || 'admin' }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          if [ -z "$KEYCLOAK_ADMIN_PASSWORD" ]; then
            KEYCLOAK_ADMIN_PASSWORD=$(kubectl -n metaos-prod get secret keycloak-secret \
              -o jsonpath='{.data.keycloak_admin_password}' | base64 -d)
            echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
            export KEYCLOAK_ADMIN_PASSWORD
          fi

          kubectl -n metaos-prod port-forward svc/keycloak 8180:80 &
          forward=$!
          trap 'kill $forward' EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://localhost:8180/realms/master && break
            sleep 1
          done

          KEYCLOAK_URL=http://localhost:8180 "keycloak/$SCRIPT"
