name: Test

# The tests deploy.yml runs before it deploys, on every pull request: master's ruleset requires them (the check `test`),
# so a pull request with auto-merge on (`gh pr merge --auto --squash`) is merged once they pass.

on:
  pull_request:
  workflow_dispatch:

# A newer push to the pull request replaces the run in progress
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          java: true
          node: true
          ffmpeg: true
      - uses: gradle/actions/setup-gradle@v5

      # The front-end's tests, type-check and build beside the app's tests, which take the longest; Testcontainers runs
      # their Postgres on the runner's Docker. Then patreon-gateway's, a build of its own, which need no browser
      - name: Test the app, the front-end and patreon-gateway
        run: |
          (cd fe && yarn test && yarn build) > "$RUNNER_TEMP/fe.log" 2>&1 &
          fe=$!
          ./gradlew --build-cache test
          fe_ok=0
          wait "$fe" || fe_ok=$?
          echo "::group::The front-end's tests and build"
          cat "$RUNNER_TEMP/fe.log"
          echo "::endgroup::"
          if [ "$fe_ok" != 0 ]; then
            echo "::error::The front-end's tests or build failed (above)"
            exit 1
          fi
          ./gradlew --build-cache -p patreon-gateway test
