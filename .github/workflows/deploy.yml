name: Build and Deploy

# Tests, builds the images and rolls them out to metaos-prod. The app's tests are a job of their own, beside the images
# rather than before them, and each image is a job of its own, so the five run at once; the deploy waits for them all,
# so an image whose tests failed is pushed but not deployed. The private registry and the API server are reached over
# Tailscale as tag:ci. Started by hand on another branch, it builds and pushes that branch's images (not as latest) and
# deploys nothing.
#
# Repo secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET                Tailscale OAuth client for tag:ci
#   DOCKER_REGISTRY_USERNAME / DOCKER_REGISTRY_PASSWORD  the registry
#   KUBECONFIG                                           base64 of the Tailscale operator kubeconfig (k8s/README.md)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# One run at a time, so the last commit is what's deployed: runs that overlapped raced to `kubectl apply`, and an older
# one finishing last would roll production back. A run waits for the one in progress, and a newer one replaces it while
# it waits; the one in progress isn't cancelled, which could stop it halfway through a rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.folk-decibel.ts.net
  IMAGES: registry.folk-decibel.ts.net/metaos

jobs:
  # The app's tests: Testcontainers runs its Postgres on the runner's Docker, and MediaProbeTest production's ffprobe
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          java: true
          ffmpeg: true
          testcontainers: true
      - uses: gradle/actions/setup-gradle@v5
      # With Gradle's build cache, which setup-gradle keeps between runs, what didn't change since isn't tested again,
      # e.g. after a change to fe/ only. Three test JVMs on the runner's four CPUs
      - name: Test the app
        run: ./gradlew --build-cache test -PtestForks=3

  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    strategy:
      matrix:
        include:
          # The boot jar only: its tests are the test job's
          - image: metaos
            dockerfile: docker/Dockerfile
            java: true
            build: ./gradlew --build-cache bootJar
          # Tested, type-checked and built into fe/.output with Yarn itself (what feTest and feBuild run). `nuxt build`
          # never makes the same files twice (a random build ID, build times, the files' mtimes in Nitro's manifest of
          # them, its styles in the order they were done), so its image is found by what it's made from, `sources`
          - image: metaos-web
            dockerfile: docker/web.Dockerfile
            node: true
            build: cd fe && yarn test && yarn build
            sources: fe docker/web.Dockerfile .github/actions/toolchain .github/workflows/deploy.yml
          # patreon-gateway is a build of its own (patreon-gateway/); its tests need no browser, and take seconds
          - image: patreon-gateway
            dockerfile: docker/patreon-gateway.Dockerfile
            java: true
            build: ./gradlew --build-cache -p patreon-gateway test bootJar
          # Nothing to build first: the Dockerfile compiles MetaOS's provider itself. `kc.sh build` makes different files
          # each time, so its layer comes from the cache (GitHub's), which keeps the image the same until Keycloak, the
          # provider or the realm changes, and Keycloak running
          - image: keycloak
            dockerfile: docker/keycloak.Dockerfile
            cache: true
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` needs the tags, which a shallow clone omits
          fetch-depth: 0

      # Before the build, which an image of the same sources spares
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          ping: registry.folk-decibel.ts.net
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # The image's key: git's hashes of its sources and the digest its base image has now, so a new base (e.g. a fix
      # in distroless) builds it again too. An image built before is tagged src-<key>
      - if: matrix.sources
        name: Look for an image of the same sources
        id: sources
        shell: bash
        env:
          IMAGE: ${{ env.IMAGES }}/${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          SOURCES: ${{ matrix.sources }}
        run: |
          base=$(awk '$1 == "FROM" { print $2; exit }' "$DOCKERFILE")
          base_digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -re .digest)
          read -ra sources <<< "$SOURCES"
          key=$({ git rev-parse "${sources[@]/#/HEAD:}"; echo "$base_digest"; } | sha256sum | cut -c1-20)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:src-$key" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:src-$key is there: tagged again, not built"
          else
            echo "No $IMAGE:src-$key: built"
          fi

      - if: matrix.build && steps.sources.outputs.found != 'true'
        uses: ./.github/actions/toolchain
        with:
          java: ${{ matrix.java || false }}
          node: ${{ matrix.node || false }}
      - if: matrix.java
        uses: gradle/actions/setup-gradle@v5
      - if: matrix.build && steps.sources.outputs.found != 'true'
        name: Build
        run: ${{ matrix.build }}

      - name: Get version tag
        id: get-tag
        run: |
          TAG=$(git describe --tags --always)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.image }} with tag: $TAG"

      # The same manifest under the commit's tag (--prefer-index=false: a copy, not an index around it), so the deploy
      # finds the digest the cluster runs and leaves the pods be
      - if: steps.sources.outputs.found == 'true'
        name: Tag the image of the same sources
        env:
          IMAGE: ${{ env.IMAGES }}/${{ matrix.image }}
          KEY: ${{ steps.sources.outputs.key }}
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          tags=(-t "$IMAGE:$TAG")
          if [ "$GITHUB_REF" = refs/heads/master ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE:src-$KEY"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest

      # Host networking puts buildkit on the tailnet, so it can push to the registry
      - if: steps.sources.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      # Reproducible: the files in the layers built here get SOURCE_DATE_EPOCH's time, not the build's, so a layer that
      # didn't change (the app's dependencies, ffprobe) is the same blob, which the registry has and isn't pushed again
      # over the tailnet, and an image that didn't change is the same image, which the deploy leaves running. No
      # provenance attestation, so the image is a plain manifest rather than an index (k8s/README.md, the registry)
      - if: steps.sources.outputs.found != 'true'
        name: Build and push
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGES }}/${{ matrix.image }}:${{ steps.get-tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/master' && format('{0}/{1}:latest', env.IMAGES, matrix.image) || '' }}
            ${{ matrix.sources && format('{0}/{1}:src-{2}', env.IMAGES, matrix.image, steps.sources.outputs.key) || '' }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
          cache-from: ${{ matrix.cache && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,scope={0},mode=max', matrix.image) || '' }}

  deploy:
    needs: [ test, image ]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://metaos.ogrodje.si
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          ping: tailscale-operator.folk-decibel.ts.net,registry.folk-decibel.ts.net
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # To look up what the tag is
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - uses: azure/setup-kubectl@v5

      - name: Setup kustomize
        run: |
          # Pinned release binary
          KVER=5.8.3
          curl -sSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KVER}/kustomize_v${KVER}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # By digest, not tag: every commit gets a new tag, but an image that didn't change keeps its digest, so its
      # Deployment stays as it is and isn't rolled (Keycloak, and patreon-gateway, whose restart cuts its job short)
      - name: Point the kustomization at the new images
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          cd k8s/base
          for image in metaos metaos-web keycloak patreon-gateway; do
            digest=$(docker buildx imagetools inspect "$IMAGES/$image:$TAG" --format '{{json .Manifest}}' \
              | jq -r .digest)
            echo "$image:$TAG is $digest"
            kustomize edit set image "$IMAGES/$image@$digest"
          done

      - name: Deploy
        run: |
          kubectl apply -k k8s/base/

          # Own keys: deployment.kubernetes.io/revision belongs to the Deployment controller
          kubectl annotate deployment metaos metaos-web patreon-gateway -n metaos-prod \
            ogrodje.si/git-sha="${GITHUB_SHA}" \
            ogrodje.si/deployed-by="${GITHUB_ACTOR}" \
            ogrodje.si/deployed-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite

          kubectl rollout status deployment/keycloak -n metaos-prod --timeout=5m
          kubectl rollout status deployment/metaos -n metaos-prod --timeout=5m
          kubectl rollout status deployment/metaos-web -n metaos-prod --timeout=5m
          kubectl rollout status deployment/patreon-gateway -n metaos-prod --timeout=5m

      - name: Smoke the deployed app
        run: |
          # Public discovery documents: prove Cloudflare, nginx, the app and Keycloak, and that the URLs line up
          meta=$(curl -sf --retry 6 --retry-delay 5 --retry-all-errors \
            https://metaos.ogrodje.si/.well-known/oauth-protected-resource/mcp)
          if ! echo "$meta" | grep -q '"resource":"https://metaos.ogrodje.si/mcp"'; then
            echo "::error::unexpected protected resource metadata: $meta"
            exit 1
          fi
          oidc=$(curl -sf --retry 6 --retry-delay 5 --retry-all-errors \
            https://metaos-auth.ogrodje.si/realms/metaos/.well-known/openid-configuration)
          if ! echo "$oidc" | grep -q '"issuer":"https://metaos-auth.ogrodje.si/realms/metaos"'; then
            echo "::error::unexpected Keycloak issuer"
            exit 1
          fi
          # The front-end renders its pages on the server, from the app's API: the episodes are in the HTML itself
          page=$(curl -sf --retry 6 --retry-delay 5 --retry-all-errors https://metaos.ogrodje.si/episodes)
          if ! echo "$page" | grep -q 'href="/episodes/S'; then
            echo "::error::the Episodes page came without its episodes"
            exit 1
          fi
          # Actuator is on the management port, which no Ingress routes
          code=$(curl -s -o /dev/null -w '%{http_code}' https://metaos.ogrodje.si/actuator/prometheus)
          if [ "$code" = 200 ]; then
            echo "::error::/actuator/prometheus is reachable through the ingress"
            exit 1
          fi
