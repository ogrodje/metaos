name: Secrets
description: >-
  Loads one of secretspec.toml's scopes from 1Password into the job's environment, masked in its log: later steps read
  them as env vars (`env.NAME`). Signs in with 1Password service account "MetaOS CI" (read-only on Ogrodje-Prod), whose
  token is the repository's only secret, OP_SERVICE_ACCOUNT_TOKEN. With `share`, it loads them once for a whole run
  instead: encrypted with the token into an artifact, which the run's other jobs open with secrets-unpack, so a run of
  many jobs reads 1Password once, not once per job (its service account is rate-limited).

inputs:
  scope:
    description: secretspec.toml's scope to load, e.g. registry or terraform
    required: true
  token:
    description: The service account's token (secrets.OP_SERVICE_ACCOUNT_TOKEN)
    required: true
  share:
    description: >-
      Set to true to share the scope with the run's other jobs (secrets-unpack) instead of loading it into this
      job's environment
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # 1Password's CLI, which secretspec's onepassword provider runs. v4.1.0
    - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50
      with:
        version: 2.42.0

    # devenv.nix's secretspec, the same version, from its release, checked against the checksum published with it
    - name: Install secretspec
      shell: bash
      env:
        VERSION: 0.21.1
      run: |
        set -euo pipefail
        base="https://github.com/cachix/secretspec/releases/download/v${VERSION}"
        file=secretspec-x86_64-unknown-linux-gnu.tar.xz
        cd "$RUNNER_TEMP"
        curl -sSfL -o "$file" "$base/$file"
        curl -sSfL -o "$file.sha256" "$base/$file.sha256"
        echo "$(cut -d' ' -f1 "$file.sha256")  $file" | sha256sum -c -
        mkdir -p secretspec-bin
        tar -xJf "$file" -C secretspec-bin --strip-components=1
        echo "$RUNNER_TEMP/secretspec-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/secretspec-bin/secretspec" --version

    # `--format gha` masks each value and appends it to $GITHUB_ENV; a required one that's missing fails the step
    - if: inputs.share != 'true'
      name: Load the ${{ inputs.scope }} secrets from 1Password
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.token }}
      run: >-
        secretspec export --profile default --scope "${{ inputs.scope }}" --format gha
        --reason "GitHub Actions ${{ github.workflow }} / ${{ github.job }}"

    # The repository is public, so are its artifacts: the bundle is encrypted (gpg, which also checks it wasn't changed)
    # with the service account's token, a passphrase only the jobs of the environment have. A day is the shortest an
    # artifact lasts; a run re-run after that makes the bundle again
    - if: inputs.share == 'true'
      name: Bundle the ${{ inputs.scope }} secrets from 1Password, encrypted
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.token }}
        SCOPE: ${{ inputs.scope }}
        REASON: GitHub Actions ${{ github.workflow }} / ${{ github.job }}
        BUNDLE: ${{ runner.temp }}/secrets-${{ inputs.scope }}/bundle.gpg
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$BUNDLE")"
        secretspec export --profile default --scope "$SCOPE" --format json --reason "$REASON" \
          | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
              --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 --output "$BUNDLE" 3<<< "$OP_SERVICE_ACCOUNT_TOKEN"

    - if: inputs.share == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: secrets-${{ inputs.scope }}
        path: ${{ runner.temp }}/secrets-${{ inputs.scope }}/bundle.gpg
        retention-days: 1
        overwrite: true
        if-no-files-found: error
