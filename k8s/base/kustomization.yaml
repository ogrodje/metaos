resources:
- namespace.yaml
- deployment-keycloak.yaml
- deployment-metaos.yaml
- deployment-web.yaml
- deployment-patreon-gateway.yaml
- deployment-temporal.yaml
- deployment-unleash.yaml

# Public URLs, read by the Deployments: Keycloak stamps them into tokens and the app checks tokens against them, so
# they have to agree; the front-end tells the browser and search engines about them. The name gets a content hash, so
# changing one rolls the Deployments.
# Keycloak has the METAOS_* URLs from Terraform (infra/keycloak/prod/main.tf), which has to change with them.
configMapGenerator:
- literals:
  - KC_HOSTNAME=https://metaos-auth.ogrodje.si
  - KEYCLOAK_ISSUER_URI=https://metaos-auth.ogrodje.si/realms/metaos
  - METAOS_MCP_URL=https://ogrodje.si/mcp
  - METAOS_API_URL=https://ogrodje.si/graphql
  - METAOS_UI_URL=https://ogrodje.si
  # Where else MetaOS takes tokens for: metaos.ogrodje.si, where it was until OG-59, for MCP clients that still connect
  # there, till it redirects (OG-60). Keycloak's metaos_other_urls
  - METAOS_OTHER_AUDIENCES=https://metaos.ogrodje.si/mcp,https://metaos.ogrodje.si/graphql
  name: public-urls
  namespace: metaos-prod

images:
- name: registry.folk-decibel.ts.net/metaos/keycloak
  newTag: "9156827"
- name: registry.folk-decibel.ts.net/metaos/metaos
  newTag: "9156827"
- name: registry.folk-decibel.ts.net/metaos/metaos-web
  newTag: "9156827"
- name: registry.folk-decibel.ts.net/metaos/patreon-gateway
  newTag: latest
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
