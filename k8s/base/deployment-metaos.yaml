apiVersion: v1
kind: ConfigMap
metadata:
  name: metaos-config
  namespace: metaos-prod
data:
  APP_LOG_LEVEL: "INFO"
  # Shared CNPG cluster; the role and database are made by k8s/set_secrets.sh
  POSTGRES_HOST: "main-cluster-rw.pg.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "metaos"
  POSTGRES_USER: "metaos"
  # Honour ingress-nginx's X-Forwarded-*, so the OAuth protected resource metadata says https://metaos.ogrodje.si.
  # Safe to trust blindly: the pod is reachable only through the Service and the Ingress.
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  # Actuator on its own port, which no Ingress routes: the kubelet and Prometheus reach it, the internet doesn't
  MANAGEMENT_SERVER_PORT: "9090"
  # Ogrodje's Google Drive folder, shared with the bot account (Drive.kt)
  METAOS_DRIVE_ROOT_FOLDER_ID: "1euKNkdlCpB2F5n77jvpJ4cRFtdvtS-Ff"
  # The bot's Koofr account; its app password is in metaos-secret (Koofr.kt)
  KOOFR_EMAIL: "iva.ogrodje@gmail.com"
  # MetaOS's files (Storage.kt); the key of the service account that may use it is in metaos-secret (google/storage.sh)
  METAOS_STORAGE_BUCKET: "ogrodje-metaos-prod"
  # Its public bucket, for pictures everyone may see (Images.kt), as the same service account; Cloudflare serves it
  METAOS_MEDIA_BUCKET: "media.ogrodje.si"
  METAOS_MEDIA_URL: "https://media.ogrodje.si"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metaos
  namespace: metaos-prod
  labels: { app: metaos }
spec:
  # Two, so one keeps answering while the other restarts or rolls out; MCP is stateless for that (application.properties)
  replicas: 2
  # Both new pods at once, while both old ones keep serving: one at a time, the second waited for the first to be ready
  # and the old one gone, a minute or two more per deploy. The node has room for two more JVMs for that long.
  strategy:
    rollingUpdate: { maxSurge: 100%, maxUnavailable: 0 }
  selector: { matchLabels: { app: metaos } }
  template:
    metadata: { labels: { app: metaos } }
    spec:
      # preStop sleep + Spring's graceful shutdown (30 s per phase)
      terminationGracePeriodSeconds: 45
      # Nothing in it talks to the Kubernetes API, so no token of the namespace's service account for whoever gets in
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot"
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: metaos
          image: registry.folk-decibel.ts.net/metaos/metaos
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9090, name: management }

          # Keeps the pod serving until ingress-nginx has dropped it from its upstreams (distroless has no `sleep`)
          lifecycle:
            preStop:
              sleep: { seconds: 10 }

          envFrom:
            - configMapRef: { name: metaos-config }
            - configMapRef: { name: public-urls }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: metaos-secret, key: postgres_password } }
            # The bot account's Google OAuth client and refresh tokens; Drive and Gmail are off without theirs
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: metaos-secret, key: google_client_id, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: metaos-secret, key: google_client_secret, optional: true } }
            - name: GOOGLE_DRIVE_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: metaos-secret, key: google_drive_refresh_token, optional: true } }
            - name: GOOGLE_GMAIL_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: metaos-secret, key: google_gmail_refresh_token, optional: true } }
            # Koofr is off without it
            - name: KOOFR_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: metaos-secret, key: koofr_app_password, optional: true } }
            # Cloud Storage is off without it
            - name: GOOGLE_STORAGE_KEY
              valueFrom: { secretKeyRef: { name: metaos-secret, key: google_storage_key, optional: true } }
            # Dropbox is off without its refresh token (dropbox/refresh_token.sh)
            - name: DROPBOX_APP_KEY
              valueFrom: { secretKeyRef: { name: metaos-secret, key: dropbox_app_key, optional: true } }
            - name: DROPBOX_APP_SECRET
              valueFrom: { secretKeyRef: { name: metaos-secret, key: dropbox_app_secret, optional: true } }
            - name: DROPBOX_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: metaos-secret, key: dropbox_refresh_token, optional: true } }
            # Patreon, through patreon-gateway (deployment-patreon-gateway.yaml); off without its token
            - name: PATREON_GATEWAY_URL
              value: http://patreon-gateway
            - name: PATREON_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: patreon-gateway-secret, key: gateway_token, optional: true } }

          # On the port that serves traffic: actuator's 9090 is a second Tomcat, which says UP even when 8080 hangs.
          # Flyway migrates before the app is up; liveness only starts counting once the startup probe has passed, and
          # that waits for the ports to open (~8 s)
          startupProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # No CPU limit: a quota would throttle JVM startup (JIT, Hibernate, Flyway) for no gain on a shared node
          # Making copies of a big picture (Images.kt) takes a few hundred MB; the JVM takes 75% of the limit as heap
          # (docker/Dockerfile), and at 1Gi the rest wasn't enough for what isn't heap. 2253Mi is 2.2Gi.
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 2253Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metaos
  namespace: metaos-prod
  labels: { app: metaos }
spec:
  type: ClusterIP
  selector: { app: metaos }
  ports:
    - { name: http, port: 80, targetPort: http }
    # For the ServiceMonitor; the Ingress routes port 80 only
    - { name: management, port: 9090, targetPort: management }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metaos-ingress
  namespace: metaos-prod
  labels: { version: "1" }
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # /mcp is Streamable HTTP: a response can be an SSE stream, which nginx must pass on unbuffered and not hang up
    # on after its default 60 s read timeout. /events, the front-end's stream of changes (Changes.kt), is one too.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # No TLS block: Cloudflare terminates TLS at the edge, as for every other service on this cluster
# MetaOS's own paths; everything else, the pages, is the front-end's (metaos-web-ingress, deployment-web.yaml)
spec:
  ingressClassName: nginx
  rules:
    - host: metaos.ogrodje.si
      http:
        paths:
          # GraphQL, the stream of changes, MCP and its OAuth metadata, the thumbnails of Koofr's and Dropbox's pictures
          - { path: /graphql, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /events, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /mcp, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /.well-known, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /koofr, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /dropbox, pathType: Prefix, backend: { service: { name: metaos, port: { number: 80 } } } }
          # The probes, public as before: they only say UP or DOWN
          - { path: /livez, pathType: Exact, backend: { service: { name: metaos, port: { number: 80 } } } }
          - { path: /readyz, pathType: Exact, backend: { service: { name: metaos, port: { number: 80 } } } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metaos
  namespace: metaos-prod
  labels: { release: prom }
spec:
  endpoints:
    - interval: 30s
      path: /actuator/prometheus
      port: management
  namespaceSelector:
    matchNames:
      - metaos-prod
  selector:
    matchLabels:
      app: metaos
