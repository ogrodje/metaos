# What the cluster's Prometheus passes on to New Relic (account 8666724, EU) by remote write: values for
# kube-prometheus-stack, Helm release `prom` in namespace observability, which every app on the cluster shares, so
# newrelic.sh lays them over the release's own. Some 200 series; the rest stay in Prometheus, as the cluster's would
# use up the free plan's 100 GB a month:
# - from namespace metaos-prod, MetaOS's own metrics (its outside connections, its stream of changes), patreon-gateway's,
#   Keycloak's sign-ins, whether their targets answer (`up`), and their pods' (kubelet's cAdvisor, kube-state-metrics):
#   memory and CPU, limits, restarts and why containers last ended (OOMKilled), readiness, replicas available;
# - the node's, which every app on it shares (node-exporter, kube-state-metrics): memory, its root filesystem, load,
#   and how hard memory is pressed (major page faults, stalls), which is how it ran out on the night of #41's deploy.
prometheus:
  prometheusSpec:
    remoteWrite:
      - url: https://metric-api.eu.newrelic.com/prometheus/v1/write?prometheus_server=ogrodje-one
        # The license key, sent as a bearer token; the secret is newrelic.sh's, beside Prometheus
        authorization:
          credentials:
            name: newrelic-remote-write
            key: license_key
        writeRelabelConfigs:
          # By namespace and name: metaos-prod's, else the node's, whatever their namespace (none, or node-exporter's)
          - sourceLabels: [namespace, __name__]
            separator: ";"
            regex: >-
              metaos-prod;(metaos_.*|patreon_gateway_.*|keycloak_user_events_total|keycloak_credentials_password_hashing_validations_total|up|container_memory_working_set_bytes|container_cpu_usage_seconds_total|container_oom_events_total|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_pod_status_ready|kube_deployment_spec_replicas|kube_deployment_status_replicas_available)|[^;]*;(node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_load1|node_load5|node_vmstat_pgmajfault|node_pressure_memory_waiting_seconds_total|node_pressure_memory_stalled_seconds_total|kube_node_status_condition|kube_node_status_allocatable)
            action: keep
          # Of the node's many mounts, its root filesystem only
          - sourceLabels: [__name__, mountpoint]
            separator: ";"
            regex: node_filesystem_(avail|size)_bytes;/.+
            action: drop
